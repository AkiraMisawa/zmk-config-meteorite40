# Pinned by commit SHA for Keyballer's build (AkiraMisawa/keyballer, docs/plans/zmk.md):
# a branch or tag could change the firmware without a commit here. The pins are what
# `main` named when this config was last changed (December 2025), before ZMK moved to
# Zephyr 4.1 and renamed the XIAO board.
manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: iwk7273
      url-base: https://github.com/iwk7273
  projects:
    # ZMK main of 2025-12-07, the last on Zephyr 3.5.
    - name: zmk
      remote: zmkfirmware
      revision: abb64ba316c29caddc49727ca2cac2f0ed5970c7
      import: app/west.yml
    # Zephyr v3.5.0+zmk-fixes, which ZMK names by branch; pinned here, as the
    # top-level definition wins. The import list is ZMK's own.
    - name: zephyr
      remote: zmkfirmware
      revision: dacab4875df72109b96cc8977547a0dc04875bcd
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_silabs
          - hal_xtensa
          - hal_st
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m
    - name: zmk-pmw3610-driver
      remote: iwk7273
      revision: 72280acc8e4467ed1b4947ee216c6bf31d0278b2
    - name: zmk-feature-sensor_rotation
      remote: iwk7273
      revision: e1a0186220ade99220d04dadf9735b758cfdf086
    - name: zmk-feature-xy_clipper
      remote: iwk7273
      revision: 643c1cabb9636de3d13e518c91c4350def1c1bb0
    - name: zmk-feature-scaling
      remote: iwk7273
      revision: 5c7402e3e9a675376cc0c32719f9fc98501afd12
  self:
    path: config
